services:
  app:                                     # name of our service
    build: .                               # build the image from the Dockerfile in this folder
    image: kannansudalai/dev:latest        # name/tag given to the built image
    container_name: react-app              # fixed name for the running container
    ports:                                 # laptop/server port 80 -> container port 80
      - "80:80"
    restart: always                        # restart automatically if it stops or the server reboots